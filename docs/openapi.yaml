openapi: 3.0.3
info:
  title: Savings Account API
  description: API for creating and retrieving savings bank accounts.
  version: 1.0.0
servers:
- url: http://localhost:8080
paths:
  /api/v1/savings-accounts:
    post:
      tags:
      - Savings Accounts
      summary: Create a savings account
      operationId: createSavingsAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSavingsAccountRequest"
        required: true
      responses:
        "201":
          description: Savings account created successfully
          headers:
            Location:
              description: URI of the newly created savings account
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsAccountResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Account nickname contains an offensive term
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Customer has reached the maximum allowed number of accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/savings-accounts/{accountNumber}:
    get:
      tags:
      - Savings Accounts
      summary: Get a savings account
      operationId: getSavingsAccount
      parameters:
      - name: accountNumber
        in: path
        description: Unique savings account number
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Savings account retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsAccountResponse"
        "404":
          description: Savings account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    CreateSavingsAccountRequest:
      required:
      - customerName
      type: object
      properties:
        customerName:
          maxLength: 100
          minLength: 1
          type: string
          description: Name of the customer
          example: John Smith
        accountNickName:
          maxLength: 30
          minLength: 5
          type: string
          description: Optional nickname for the savings account
          nullable: true
          example: Holiday Fund
    SavingsAccountResponse:
      required:
      - accountNumber
      - createdAt
      - customerName
      - id
      type: object
      properties:
        id:
          type: string
          description: Internal identifier generated by the API
          format: uuid
          example: a7063981-44a0-44de-a150-0151a533c063
        accountNumber:
          type: string
          description: Unique account number generated by the API
          example: "1000000001"
        customerName:
          type: string
          example: Gihal Mapalagama
        accountNickName:
          type: string
          nullable: true
          example: Entertainment
        createdAt:
          type: string
          description: Time the account was created
          format: date-time
    ApiError:
      required:
      - code
      - message
      - timestamp
      type: object
      properties:
        code:
          type: string
          example: ACCOUNT_LIMIT_EXCEEDED
        message:
          type: string
          example: A customer cannot have more than 5 savings accounts
        timestamp:
          type: string
          format: date-time

