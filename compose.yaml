services:
  postgres:
    image: postgres:16
    container_name: savings-account-postgres
    environment:
      POSTGRES_DB: savings_account
      POSTGRES_USER: savings_user
      POSTGRES_PASSWORD: savings_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: