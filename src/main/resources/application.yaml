spring:
  application:
    name: account

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/savings_account}
    username: ${DB_USERNAME:savings_user}
    password: ${DB_PASSWORD:savings_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration